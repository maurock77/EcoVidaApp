<html>
    <head>
        <meta charset="utf-8">
        <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/index.css">
        <title>EcoVida</title>
    </head>
    <body>
          <header>
        <h1>🌎 EcoVida</h1>
        <p>Construyendo un futuro sostenible</p>
    </header>

    <main>

        <!-- Perfil -->
        <section class="card">
            <h2>Mi Perfil</h2>

            <input type="text" id="nombre" placeholder="Nombre">

            <input type="number" id="meta" placeholder="Meta mensual de actividades">

            <button id="btnGuardarPerfil">
                Guardar Perfil
            </button>

            <p id="perfilInfo"></p>
        </section>

        <!-- Registro -->
        <section class="card">
            <h2>Registro de Actividades</h2>

            <select id="actividad">
                <option value="1">Reciclaje</option>
                <option value="2">Uso de bicicleta</option>
                <option value="3">Ahorro de agua</option>
                <option value="4">Ahorro de energía</option>
            </select>

            <button id="btnRegistrarActividad">
                Registrar
            </button>

            <h3>Total de Actividades:</h3>
            <p id="contador">0</p>
        </section>

        <!-- Consejos -->
        <section class="card">
            <h2>Consejo Sustentable</h2>

            <p id="consejo"></p>

            <button id="btnConsejo">
                Nuevo Consejo
            </button>
        </section>

        <!-- Calculadora -->
        <section class="card">
            <h2>Calculadora de Impacto</h2>

            <label>Actividades Realizadas:</label>

            <input type="number" id="cantidadImpacto">

            <button id="btnCalcularImpacto">
                Calcular
            </button>

            <p id="resultadoImpacto"></p>
        </section>

        <!-- Recursos -->
        <section class="card">
            <h2>Recursos Educativos</h2>

            <ul>
                <li>
                    <a href="#">
                        Guía de reciclaje doméstico
                    </a>
                </li>

                <li>
                    <a href="#">
                        Energías renovables
                    </a>
                </li>

                <li>
                    <a href="#">
                        Consumo responsable
                    </a>
                </li>
            </ul>
        </section>


    </main>
        <script src="cordova.js"></script>
        <script src="js/index.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
